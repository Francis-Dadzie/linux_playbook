# load-balancer.conf
# Distributes traffic across multiple backend servers.
# Place in /etc/nginx/conf.d/
# Replace: example.com, backend server IPs/ports

# Define the upstream pool — nginx distributes requests across these servers
upstream app_backend {
    # Load balancing method — choose ONE:
    least_conn;       # send to server with fewest active connections (recommended)
    # ip_hash;        # sticky sessions by client IP
    # round-robin     # default if no method is specified — comment out least_conn

    # Backend servers
    server 10.0.0.10:3000 weight=1 max_fails=3 fail_timeout=30s;
    server 10.0.0.11:3000 weight=1 max_fails=3 fail_timeout=30s;
    server 10.0.0.12:3000 weight=1 max_fails=3 fail_timeout=30s;

    # Backup server — only receives traffic when all primary servers are down
    server 10.0.0.13:3000 backup;

    # Keep persistent connections to backends (reduces TCP overhead)
    keepalive 32;
}

# Optional: separate upstream for a different service or read replicas
upstream api_backend {
    least_conn;
    server 10.0.0.20:8080 max_fails=3 fail_timeout=30s;
    server 10.0.0.21:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    # TLS
    ssl_certificate     /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logs — include upstream info for debugging
    access_log /var/log/nginx/example.com.access.log proxy;
    error_log  /var/log/nginx/example.com.error.log warn;

    server_tokens off;
    client_max_body_size 20m;

    # Route /api/ requests to the API backend
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";            # required for upstream keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Try next server on failure
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Route all other requests to the app backend
    location / {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503;
    }

    # Health check — returns upstream status
    # Requires nginx-module-upstream-check or use a simple proxy pass to /health
    location = /health {
        proxy_pass http://app_backend/health;
        access_log off;
    }

    # Expose nginx status (restrict to monitoring server IP)
    location = /nginx_status {
        stub_status;
        allow 10.0.0.0/8;     # allow your monitoring server
        deny all;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

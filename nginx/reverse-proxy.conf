# reverse-proxy.conf
# Proxies requests to a single backend application (Node.js, Python, Java, etc.)
# Place in /etc/nginx/conf.d/
# Replace: example.com, 127.0.0.1:3000 (your app's address and port)

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    # TLS
    ssl_certificate     /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logs
    access_log /var/log/nginx/example.com.access.log proxy;
    error_log  /var/log/nginx/example.com.error.log warn;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Limit upload size
    client_max_body_size 20m;

    # Proxy all requests to the backend app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Pass real client info to the app
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (safe to leave in even if not using WebSockets)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Remove internal headers from upstream response
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
    }

    # Serve static files directly from nginx (faster than going through the app)
    location /static/ {
        alias /var/www/example.com/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint — no logging, quick response
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

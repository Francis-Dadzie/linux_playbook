# ssl-termination.conf
# nginx handles TLS — backends receive plain HTTP.
# This is the standard pattern for load balancers and reverse proxies.
# Place in /etc/nginx/conf.d/
# Replace: example.com, certificate paths, backend address

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                    # enable HTTP/2 (requires TLS)
    server_name example.com www.example.com;

    # Certificate and key
    ssl_certificate     /etc/nginx/ssl/example.com.chained.crt;  # cert + intermediate CA
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # TLS protocol and cipher configuration
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Session resumption
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DH parameters (generate once: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048)
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # OCSP Stapling — faster cert validation for clients
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS — tell browsers to always use HTTPS (1 year)
    # WARNING: only enable once you're certain HTTPS works correctly
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Other security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Logs
    access_log /var/log/nginx/example.com.ssl.access.log main;
    error_log  /var/log/nginx/example.com.ssl.error.log warn;

    # Proxy to backend (plain HTTP — TLS is terminated here)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Tell backend the original connection was HTTPS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # always 'https' — we terminated TLS
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}

# security-headers.conf
# A reusable snippet for security headers.
# Include in any server {} block with: include snippets/security-headers.conf;
# Or copy the headers directly into your server block.
#
# Place this file at: /etc/nginx/snippets/security-headers.conf

# ─────────────────────────────────────────────
# CORE SECURITY HEADERS
# ─────────────────────────────────────────────

# Prevent nginx from exposing its version in headers and error pages
server_tokens off;

# Prevent the page from being embedded in an iframe on other domains
# SAMEORIGIN: allows framing only by pages on the same domain
# DENY: disallows all framing (use for apps with no legitimate iframe use)
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent browsers from MIME-sniffing the Content-Type
# Stops browsers from treating non-executable files as scripts
add_header X-Content-Type-Options "nosniff" always;

# Legacy XSS protection for older browsers (IE, older Chrome/Safari)
# Modern browsers use CSP instead — this is belt-and-suspenders
add_header X-XSS-Protection "1; mode=block" always;

# Control how much referrer info is sent with requests
# strict-origin-when-cross-origin: full URL for same-origin, just origin for cross-origin HTTPS
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ─────────────────────────────────────────────
# HTTPS-ONLY HEADERS (only set on SSL server blocks)
# ─────────────────────────────────────────────

# HSTS: tell browsers to only use HTTPS for 1 year
# includeSubDomains: applies to all subdomains too
# preload: eligible for browser preload lists (only add if you're committed to HTTPS)
# WARNING: test on a staging environment first — hard to undo
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ─────────────────────────────────────────────
# CONTENT SECURITY POLICY
# ─────────────────────────────────────────────
# CSP is the most powerful XSS defence — but must be tailored to your app.
# Start with a strict policy and relax only what your app actually needs.
# Use Report-Only mode first to find violations before enforcing.

# Report-only mode (logs violations, doesn't block — use to audit first)
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; report-uri /csp-report" always;

# Enforcing mode — choose the right policy for your app type:

# Option 1: Strict — pure API backend or static site with no inline JS/CSS
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Option 2: Moderate — app with inline styles (uncomment to replace option 1)
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self';" always;

# Option 3: Relaxed — legacy app with inline JS (not recommended for new apps)
# add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src *;" always;

# ─────────────────────────────────────────────
# PERMISSIONS POLICY
# ─────────────────────────────────────────────
# Disable browser features your app doesn't need
# Prevents malicious scripts from accessing sensitive APIs even if injected
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# ─────────────────────────────────────────────
# CACHE CONTROL FOR SENSITIVE PAGES
# ─────────────────────────────────────────────
# Prevent browsers and proxies from caching authenticated or sensitive responses
# Apply only on location blocks that serve dynamic/authenticated content
# add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
# add_header Pragma "no-cache" always;

# ─────────────────────────────────────────────
# CROSS-ORIGIN HEADERS (if needed)
# ─────────────────────────────────────────────
# Only add these if your API is consumed by a different origin (CORS)
# add_header Access-Control-Allow-Origin  "https://app.example.com" always;
# add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
# add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

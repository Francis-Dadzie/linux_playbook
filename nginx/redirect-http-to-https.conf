# redirect-http-to-https.conf
# Redirects all HTTP traffic to HTTPS.
# This block is typically paired with an SSL server block in the same file.
# Place in /etc/nginx/conf.d/ alongside your main server config.

# ─────────────────────────────────────────────
# OPTION 1: Single domain redirect (most common)
# ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Permanent redirect — preserves path and query string
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────
# OPTION 2: Catch-all redirect (redirects ALL HTTP on this server)
# ─────────────────────────────────────────────
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# ─────────────────────────────────────────────
# OPTION 3: Redirect with domain canonicalization
# Forces www → non-www AND http → https in one step
# ─────────────────────────────────────────────
# server {
#     listen 80;
#     listen [::]:80;
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name www.example.com;
#
#     ssl_certificate     /etc/nginx/ssl/example.com.crt;
#     ssl_certificate_key /etc/nginx/ssl/example.com.key;
#
#     return 301 https://example.com$request_uri;
# }

# ─────────────────────────────────────────────
# OPTION 4: Let's Encrypt ACME challenge exception
# Allow certbot to renew certs over HTTP before HTTPS is fully set up
# ─────────────────────────────────────────────
# server {
#     listen 80;
#     listen [::]:80;
#     server_name example.com www.example.com;
#
#     # Allow Let's Encrypt certificate validation over HTTP
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#
#     # Redirect everything else to HTTPS
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

# ─────────────────────────────────────────────
# NOTES
# ─────────────────────────────────────────────
# 301 = permanent redirect (browsers and search engines cache this)
# 302 = temporary redirect (use during testing — does not get cached)
#
# During initial setup, use 302 until you're certain HTTPS works:
# return 302 https://$host$request_uri;
#
# Then switch to 301 once confirmed working.
#
# $host        = value of Host header from the client request
# $request_uri = full URI including path and query string

# rate-limiting.conf
# Protects endpoints from abuse, brute force, and DDoS.
# The limit zones must be defined in the http {} block (nginx.conf or a separate snippet).
# Place rate limit zone definitions in /etc/nginx/conf.d/rate-limit-zones.conf
# and include this file or copy location blocks into your server config.

# ─────────────────────────────────────────────
# 1. DEFINE ZONES — put these in your http {} block (nginx.conf)
# ─────────────────────────────────────────────

# General API rate limit: 10 requests/second per IP
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Login endpoint: stricter — 5 requests/minute per IP
# limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Global connection limit: max 20 simultaneous connections per IP
# limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Whitelist internal IPs from all limits
# geo $limit_key {
#     default              $binary_remote_addr;
#     10.0.0.0/8           "";   # internal — no limit
#     192.168.0.0/16       "";
# }
# limit_req_zone $limit_key zone=api_limit:10m rate=10r/s;

# ─────────────────────────────────────────────
# 2. APPLY IN SERVER BLOCK
# ─────────────────────────────────────────────

server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate     /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # Return 429 Too Many Requests (not 503) when rate limited
    limit_req_status  429;
    limit_conn_status 429;

    # Global connection limit — apply at server level
    limit_conn conn_limit 20;

    # General API — allow burst of 20, process immediately
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Login endpoint — strict, no burst
    # Prevents brute force: max 5 login attempts per minute per IP
    location = /auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000/auth/login;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Registration endpoint — also strict
    location = /auth/register {
        limit_req zone=login_limit burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000/auth/register;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Password reset — very strict
    location = /auth/reset-password {
        limit_req zone=login_limit burst=1 nodelay;
        proxy_pass http://127.0.0.1:3000/auth/reset-password;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static files — no rate limiting needed
    location /static/ {
        alias /var/www/example.com/static/;
        expires 30d;
        access_log off;
    }

    # Everything else — standard rate limit
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Custom error pages for rate limit responses
    error_page 429 /429.html;
    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# php-fpm.conf
# Serves a PHP application via PHP-FPM (WordPress, Laravel, Symfony, etc.)
# Place in /etc/nginx/conf.d/
# Replace: example.com, /var/www/example.com, PHP socket path

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;

    root  /var/www/example.com/public;
    index index.php index.html;

    # TLS
    ssl_certificate     /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logs
    access_log /var/log/nginx/example.com.access.log main;
    error_log  /var/log/nginx/example.com.error.log warn;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Max upload size — match php.ini upload_max_filesize
    client_max_body_size 64m;

    # Static assets — serve directly without PHP
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot|pdf|zip)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Main location block
    # For WordPress: passes all requests to index.php if file/directory doesn't exist
    # For Laravel:   same pattern — all routes handled by public/index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP files to PHP-FPM
    location ~ \.php$ {
        # Security: only process PHP files that actually exist
        try_files $uri =404;

        # Mitigate path traversal vulnerabilities
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # PHP-FPM socket — update to match your PHP version and config
        # Unix socket (preferred — faster than TCP):
        fastcgi_pass unix:/run/php-fpm/www.sock;
        # TCP (use if PHP-FPM is on a different server):
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;

        # Pass the script path to PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        include fastcgi_params;

        # Timeouts — increase for slow scripts (e.g., large imports)
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout    180;
        fastcgi_read_timeout    180;

        # Buffering
        fastcgi_buffer_size  32k;
        fastcgi_buffers      16 16k;
    }

    # WordPress-specific: deny access to wp-config and sensitive files
    location ~* /wp-config\.php { deny all; }
    location ~* /xmlrpc\.php    { deny all; }   # blocks XML-RPC brute force

    # Deny hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny direct access to .htaccess (legacy Apache files)
    location ~ /\.ht {
        deny all;
    }

    error_page 404             /404.php;
    error_page 500 502 503 504 /50x.html;
}
